      metricName : mutatingAPICallsLatency
      metric_of_interest: value
      agg:
        value: latency
        agg_type: max
      labels:
        - "[Jira: mutatingAPICallsLatency]"
      direction: 1
    - name:  mutatingAPICallsLatency_apirequestcounts
      metricName : mutatingAPICallsLatency
      metric_of_interest: value
      labels.resource.keyword: apirequestcounts
