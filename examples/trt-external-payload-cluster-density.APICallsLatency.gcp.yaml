tests :
  - name : gcp-24-cluster-density-v2
    index: {{ es_metadata_index }}
    benchmarkIndex: {{ es_benchmark_index }}
    metadata:
      platform: GCP
      clusterType: self-managed
      masterNodesType: e2-custom-6-16384
      masterNodesCount: 3
      workerNodesType: e2-standard-4
      workerNodesCount: 24
      benchmark.keyword: cluster-density-v2
      ocpVersion: {{ version }}
      networkType: OVNKubernetes

    metrics : 
    - name:  max-ro-apicalls-latency
      metricName.keyword: max-ro-apicalls-latency
      metric_of_interest: value
      agg:
        value: latency
        agg_type: max
      labels:
        - "[Jira: max-ro-apicalls-latency]"
      direction: 1
    - name:  max-mutating-apicalls-latency
      metricName.keyword: max-mutating-apicalls-latency
      metric_of_interest: value
      agg:
        value: latency
        agg_type: max
      labels:
        - "[Jira: max-mutating-apicalls-latency]"
      direction: 1
    - name:  avg-ro-apicalls-latency
      metricName.keyword: avg-ro-apicalls-latency
      metric_of_interest: value
      agg:
        value: latency
        agg_type: avg
      labels:
        - "[Jira: avg-ro-apicalls-latency]"
      direction: 1
    - name:  max-ro-apicalls-latency
      metricName.keyword: max-ro-apicalls-latency
      metric_of_interest: value
      agg:
        value: latency
        agg_type: avg
      labels:
        - "[Jira: max-ro-apicalls-latency]"
      direction: 1
    - name:  max-mutating-apicalls-latency
      metricName.keyword: max-mutating-apicalls-latency
      metric_of_interest: value
      agg:
        value: latency
        agg_type: avg
      labels:
        - "[Jira: max-mutating-apicalls-latency]"
      direction: 1
