tests :
  - name : payload-cluster-density-v2
    index: {{ es_metadata_index }}
    benchmarkIndex: {{ es_benchmark_index }}
    metadata:
      platform: AWS
      clusterType: self-managed
      masterNodesType: m6a.xlarge
      masterNodesCount: 3
      workerNodesType: m6a.xlarge
      workerNodesCount: 6
      benchmark.keyword: cluster-density-v2
      ocpVersion: {{ version }}
      networkType: OVNKubernetes

    metrics : 
    - name:  podReadyLatency
      metricName: podLatencyQuantilesMeasurement
      quantileName: Ready
      metric_of_interest: max
      not: 
        jobConfig.name: "garbage-collection"
      labels:
        - "[Jira: PerfScale]"
      direction: 1

    - name:  cgroupCPUSeconds-namespaces
      metricName : cgroupCPUSeconds-namespaces
      labels.namespace.keyword: openshift-kube-apiserver
      metric_of_interest: value
      agg:
        value: cpu
        agg_type: avg
      labels:
        - "[Jira: kube-apiserver]"
      direction: 1

    - name:  nodeCPUSeconds-Workers
      metricName : nodeCPUSeconds-Workers
      labels.mode.keyword: idle
      metric_of_interest: value
      agg:
        value: cpu
        agg_type: avg
      labels:
        - "[Jira: nodeCPUSeconds-Workers idle]"
      direction: 1
    - name:  nodeCPUSeconds-Workers
      metricName : nodeCPUSeconds-Workers
      labels.mode.keyword: idle
      metric_of_interest: value
      agg:
        value: cpu
        agg_type: min
      labels:
        - "[Jira: nodeCPUSeconds-Workers idle]"
      direction: 1
    - name:  nodeCPUSeconds-Workers
      metricName : nodeCPUSeconds-Workers
      labels.mode.keyword: idle
      metric_of_interest: value
      agg:
        value: cpu
        agg_type: max
      labels:
        - "[Jira: nodeCPUSeconds-Workers idle]"
      direction: 1
    - name:  nodeCPUSeconds-Masters
      metricName : nodeCPUSeconds-Masters
      labels.mode.keyword: idle
      metric_of_interest: value
      agg:
        value: cpu
        agg_type: avg
      labels:
        - "[Jira: nodeCPUSeconds-Masters idle]"
      direction: 1
    - name:  nodeCPUSeconds-Masters
      metricName : nodeCPUSeconds-Masters
      labels.mode.keyword: idle
      metric_of_interest: value
      agg:
        value: cpu
        agg_type: min
      labels:
        - "[Jira: nodeCPUSeconds-Masters idle]"
      direction: 1
    - name:  nodeCPUSeconds-Masters
      metricName : nodeCPUSeconds-Masters
      labels.mode.keyword: idle
      metric_of_interest: value
      agg:
        value: cpu
        agg_type: max
      labels:
        - "[Jira: nodeCPUSeconds-Masters idle]"
      direction: 1
    - name:  max-memory-sum-workers
      metricName :   max-memory-sum-workers
      metric_of_interest: value
      agg:
        value: mem
        agg_type: max
      labels:
        - "[Jira: max-memory-sum-workers idle]"
      direction: 1
    - name:  max-memory-sum-masters
      metricName :   max-memory-sum-masters
      metric_of_interest: value
      agg:
        value: mem
        agg_type: max
      labels:
        - "[Jira: max-memory-sum-masters idle]"
      direction: 1
    - name: cgroupMemoryRSS-Workers-system
      metricName : cgroupMemoryRSS-Workers
      metric_of_interest: value
